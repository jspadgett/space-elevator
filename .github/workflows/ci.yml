name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    name: ShellCheck + generation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck
      # SC2016: single-quoted $ in generated Nix and shell snippets.
      # SC2329: test helpers are called indirectly, through `check`.
      - name: Lint scripts
        run: shellcheck -S info -e SC2016,SC2329 scaffold.sh tests/run.sh
      - name: Generate configs for every desktop, GPU and flavor
        run: bash tests/run.sh

  checks:
    name: Module set evaluation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # tests/checks.nix: every feature combination evaluates, the
      # assertions fire when they should, and importing the module set
      # without enabling it changes nothing.
      - name: nix flake check
        run: nix flake check --print-build-logs

  packaged:
    name: The packaged apps, as users run them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # tests/run.sh drives the scripts with the system bash. The
      # shipped apps run on the minimal bash from nixpkgs, which is
      # built without programmable completion and a few other
      # niceties — so exercise the real binaries too, and treat
      # anything on stderr about a missing command as a failure.
      - name: Generate a config with the packaged wizard
        env:
          SE_NONINTERACTIVE: "1"
          SE_HOSTNAME: citest
          SE_USERNAME: ci
          SE_TIMEZONE: Etc/UTC
          SE_LOCALE: en_US.UTF-8
          SE_KEYMAP: us
          SE_GPU: AMD
          SE_DE: GNOME
          SE_FLAVORS: development
          SE_OUTDIR: ${{ github.workspace }}/out
        run: |
          nix run .#default 2>&1 | tee wizard.log
          ! grep -qiE "command not found|unbound variable" wizard.log
      - name: Upgrade it with the packaged upgrade app
        run: |
          nix run .#upgrade -- \
            --config "$PWD/out" --output "$PWD/upgraded" --yes --no-build 2>&1 | tee upgrade.log
          ! grep -qiE "command not found|unbound variable" upgrade.log
      - name: The upgrade kept the answers and invented nothing
        run: |
          switches=upgraded/hosts/citest/space-elevator.nix
          grep -qE '^\s+desktop\.gnome\.enable = true;' "$switches"
          grep -qE '^\s+gpu\.amd\.enable = true;' "$switches"
          grep -qE '^\s+development\.enable = true;' "$switches"
          ! grep -qE '^\s+desktop\.plasma\.enable = true;' "$switches"
          ! grep -qE '^\s+gpu\.nvidia' "$switches"
          test -f upgraded/UPGRADE-NOTES.md

  eval:
    name: Evaluate generated config (${{ matrix.de }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        de: ["KDE Plasma", "GNOME", "COSMIC", "Hyprland"]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Generate a full-flavor config
        env:
          SE_NONINTERACTIVE: "1"
          SE_HOSTNAME: citest
          SE_USERNAME: ci
          SE_TIMEZONE: Etc/UTC
          SE_LOCALE: en_US.UTF-8
          SE_KEYMAP: us
          SE_GPU: NVIDIA
          SE_DE: ${{ matrix.de }}
          SE_FLAVORS: development,kdeconnect
          SE_OUTDIR: ${{ github.workspace }}/out
        run: MODULE_SOURCE="$PWD/modules" bash scaffold.sh
      - name: Evaluate the VM build (exercises every enabled module)
        working-directory: out
        run: |
          nix eval \
            .#nixosConfigurations.citest.config.system.build.vm.drvPath

  eval-gpu:
    name: Evaluate generated config (GPU ${{ matrix.gpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu: ["AMD", "Intel", "None / VM"]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # No flavors here: this matrix is about the driver the wizard
      # picks, and a bare config is the one nothing else props up.
      - name: Generate a config for this GPU
        env:
          SE_NONINTERACTIVE: "1"
          SE_HOSTNAME: citest
          SE_USERNAME: ci
          SE_TIMEZONE: Etc/UTC
          SE_LOCALE: en_US.UTF-8
          SE_KEYMAP: us
          SE_GPU: ${{ matrix.gpu }}
          SE_DE: GNOME
          SE_FLAVORS: ""
          SE_OUTDIR: ${{ github.workspace }}/out
        run: MODULE_SOURCE="$PWD/modules" bash scaffold.sh
      - name: Evaluate the VM build
        working-directory: out
        run: |
          nix eval \
            .#nixosConfigurations.citest.config.system.build.vm.drvPath

  iso-eval:
    name: Evaluate the installer ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate the ISO image derivation
        run: |
          nix eval \
            .#nixosConfigurations.space-elevator-iso.config.system.build.isoImage.drvPath
